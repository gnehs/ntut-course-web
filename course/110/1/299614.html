    <title>𝟮𝟵𝟵𝟲𝟭𝟰 社會哲學</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="唸社會哲學的主要原因在於，在社會的架構之內，從哲學的角度去探索一系列很根本的問題。它們包括﹕正義、公平、人權、自由、公民意識、市場與道德、科技與道德的關係等等。我們的探索是以哲學知識做為基礎，例如：功利主義、康德的道德哲學、羅爾斯的正義理論，還有內格爾、多爾肯、與沈對公平理念的討論等等。由於這些問題與我們的福祉休戚相關，身為一個受過良好教育的社會公民，我們便需要具有社會哲學的知識。準此，我們可以了解社會是如何運作的，並且能夠對一些和我們個人利益乃至公共福祉相關的社會性議題進行反省，從而對它們做出正確的抉擇。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟵𝟵𝟲𝟭𝟰 社會哲學"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="唸社會哲學的主要原因在於，在社會的架構之內，從哲學的角度去探索一系列很根本的問題。它們包括﹕正義、公平、人權、自由、公民意識、市場與道德、科技與道德的關係等等。我們的探索是以哲學知識做為基礎，例如：功利主義、康德的道德哲學、羅爾斯的正義理論，還有內格爾、多爾肯、與沈對公平理念的討論等等。由於這些問題與我們的福祉休戚相關，身為一個受過良好教育的社會公民，我們便需要具有社會哲學的知識。準此，我們可以了解社會是如何運作的，並且能夠對一些和我們個人利益乃至公共福祉相關的社會性議題進行反省，從而對它們做出正確的抉擇。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/110/1/299614"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=110&sem=1&id=299614"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Conden
