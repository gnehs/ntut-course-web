<!DOCTYPE html><html lang="zh-TW" data-n-head="%7B%22lang%22:%7B%221%22:%22zh-TW%22%7D%7D"><head>
    <title>𝟮𝟮𝟱𝟬𝟴𝟳 互動裝置實作</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程內容旨在培養互動裝置相關製作所需之實作能力，分為下列四個方向的學習：1.裝置製作資源，瞭解不同的裝置製作之工具及材料，透過搜尋實體廠商或網路商店，集結可以提供製作服務、元件、材料之廠商資源，2.裝置造形與結構，瞭解如何繪製裝置造形與結構之設計尺寸圖，以及整理出製作所需之材料明細表，並且加以製作，自行製作或是委託製作，3.裝置電路製作，瞭解如何繪製電路圖，並且透過印刷電路板製作、 電子元件焊接、及外接盒之製作，完成互裝置電路設計， 4.機電驅動製作，瞭解如何使用驅動裝置， 例如：馬達及相關傳動機構(齒輪、連桿)。(本課程因為需要提供設備，需有修課人數的限制，建議以20人為限，4人為1組，共分5組)"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟮𝟱𝟬𝟴𝟳 互動裝置實作"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程內容旨在培養互動裝置相關製作所需之實作能力，分為下列四個方向的學習：1.裝置製作資源，瞭解不同的裝置製作之工具及材料，透過搜尋實體廠商或網路商店，集結可以提供製作服務、元件、材料之廠商資源，2.裝置造形與結構，瞭解如何繪製裝置造形與結構之設計尺寸圖，以及整理出製作所需之材料明細表，並且加以製作，自行製作或是委託製作，3.裝置電路製作，瞭解如何繪製電路圖，並且透過印刷電路板製作、 電子元件焊接、及外接盒之製作，完成互裝置電路設計， 4.機電驅動製作，瞭解如何使用驅動裝置， 例如：馬達及相關傳動機構(齒輪、連桿)。(本課程因為需要提供設備，需有修課人數的限制，建議以20人為限，4人為1組，共分5組)"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/105/2/225087"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=105&sem=2&id=225087"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="style
