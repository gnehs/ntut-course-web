    <title>𝟮𝟮𝟲𝟬𝟭𝟲 永續建築創意研究</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程主要針對永續建築設計創意進行探討。宇宙萬物瞬息變化，在全球既有之永續建築觀念中，研究者如何在不違背這些觀念的前提下，整合各種不同觀念並提出符合其專業道德之創意思維，以確實滿足符合目前及未來國際潮流對於永續理念的看法；研究者在學習過程中會發現：永續建築設計創意對應永續議題時，那將不只是理論而已，它更必需是融合建築專業實務、技術、道德等因素之結晶。永續建築設計創意不容被挑戰，卻也經常被挑戰；然而，永續建築設計創意如何能夠經得起不同的挑戰與看法，這關乎研究者對於永續建築與設計創意之理解程度；因此，研究者除必需提供相關資訊說明其創意與永續之關係外，更必需提出其創意如何與永續應對，以使所提之創意理念不是空談。換言之，本課程期望透過討論與辯證，進而傳授研究者學習如何整合問題並提出新的思維，而此思維將會符合未來實務所需，以使研究者在學時已具備未來進入職場解決問題之能力。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟮𝟲𝟬𝟭𝟲 永續建築創意研究"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程主要針對永續建築設計創意進行探討。宇宙萬物瞬息變化，在全球既有之永續建築觀念中，研究者如何在不違背這些觀念的前提下，整合各種不同觀念並提出符合其專業道德之創意思維，以確實滿足符合目前及未來國際潮流對於永續理念的看法；研究者在學習過程中會發現：永續建築設計創意對應永續議題時，那將不只是理論而已，它更必需是融合建築專業實務、技術、道德等因素之結晶。永續建築設計創意不容被挑戰，卻也經常被挑戰；然而，永續建築設計創意如何能夠經得起不同的挑戰與看法，這關乎研究者對於永續建築與設計創意之理解程度；因此，研究者除必需提供相關資訊說明其創意與永續之關係外，更必需提出其創意如何與永續應對，以使所提之創意理念不是空談。換言之，本課程期望透過討論與辯證，進而傳授研究者學習如何整合問題並提出新的思維，而此思維將會符合未來實務所需，以使研究者在學時已具備未來進入職場解決問題之能力。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/105/2/226016"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=105&sem=2&id=226016"><li
