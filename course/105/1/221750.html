<!DOCTYPE html><html lang="zh-TW" data-n-head="%7B%22lang%22:%7B%221%22:%22zh-TW%22%7D%7D"><head>
    <title>𝟮𝟮𝟭𝟳𝟱𝟬 教學原理</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程的目標在於使學生了解，要想做一個優良的教師，必須知道先要充實自己，除了不斷的充實專門的知識和技能以外，應多學習些教育的理論和方法，試著利用理論以指導經驗，並從實際經驗中去驗證理論。一個剛從學校畢業出來的教師，要儘量利用教育專業的知識和技能，努力學習做好教學的工作。例如要知道如何去組織、分析、調整、和補充教材，如何去設計教學活動，如何練習活用教法及教學技術，如何提高學生的學習興趣，如何養成學生之良好的學習習慣，如何加強常規的訓練和教室的管理，如何和諧教室的氣氛，和何進行教學的評鑑等，都是教師應當研究改進的重要課題。在實際工作中去尋求學理的根據;並以理論去指導工作的進行，如此日就月將，自會增進教學的效果。本課程擬培養之核心能力與指標：1-1具備教育專業知識並掌握重要教育議題之能力。1-2具備領域/學科知識及相關教學知能。2-1具備課程與教學設計能力。2-2具備善用教學策略進行有效教學之能力。2-3具備運用適切方法進行學習評量之能力。3-2具備掌握學生差異進行相關輔導之能力。5-1具備致力教師專業成長之能力。(各項指標內容請點連結詳閱了"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟮𝟭𝟳𝟱𝟬 教學原理"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程的目標在於使學生了解，要想做一個優良的教師，必須知道先要充實自己，除了不斷的充實專門的知識和技能以外，應多學習些教育的理論和方法，試著利用理論以指導經驗，並從實際經驗中去驗證理論。一個剛從學校畢業出來的教師，要儘量利用教育專業的知識和技能，努力學習做好教學的工作。例如要知道如何去組織、分析、調整、和補充教材，如何去設計教學活動，如何練習活用教法及教學技術，如何提高學生的學習興趣，如何養成學生之良好的學習習慣，如何加強常規的訓練和教室的管理，如何和諧教室的氣氛，和何進行教學的評鑑等，都是教師應當研究改進的重要課題。在實際工作中去尋求學理的根據;並以理論去指導工作的進行，如此日就月將，自會增進教學的效果。本課程擬培養之核心能力與指標：1-1具備教育專業知識並掌握重要教育議題之能力。1-2具備領域/學科知識及相關教學知能。2-1具備課程與教學設計能力。2-2具備善用教學策略進行有效教學之能力。2-3具備運用適切方法進行學習評量之能力。3-2具備掌握學生差異進行相關輔導之能力。5-1具備致力教師專業成長之能力。(各項指標內容請點連結詳閱了"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/cour
