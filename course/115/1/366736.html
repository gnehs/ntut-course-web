    <title>𝟯𝟲𝟲𝟳𝟯𝟲 材料系統與永續構築</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="從「材料」的角度看設計，始終是一個充滿啟發且值得深入探討的位置。當前，建築產業對環境造成的衝擊尤為顯著，包含營運與隱含碳排放、大量廢棄物污染、熱島效應等問題，皆反映快速開發對自然環境所帶來的劇烈破壞。因此，「設計階段決定建物 80% 環境影響」的觀點逐漸受到重視，而將「材料視為設計過程固有部分」的「材料系統（Material System）」概念，也再次使忠於材料本質與特性的精神回歸設計核心。本課程將聚焦於「木框架／實木」、「竹」、「稻草」、「軟木」、「夯土」、「磚」、「石材」等植物基與低碳材料，探討其於當代建築與空間設計中的應用可能。課程將從封閉式材料循環（Closed-Loop Material Cycles）與永續設計觀點出發，透過國內外案例分析，說明不同材料之構造系統、材料細節與製造邏輯，並進一步探討其與場域脈絡、地方文化及永續經濟性之間的關聯，建立同學對於材料、構築與環境之整合性理解。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟲𝟲𝟳𝟯𝟲 材料系統與永續構築"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="從「材料」的角度看設計，始終是一個充滿啟發且值得深入探討的位置。當前，建築產業對環境造成的衝擊尤為顯著，包含營運與隱含碳排放、大量廢棄物污染、熱島效應等問題，皆反映快速開發對自然環境所帶來的劇烈破壞。因此，「設計階段決定建物 80% 環境影響」的觀點逐漸受到重視，而將「材料視為設計過程固有部分」的「材料系統（Material System）」概念，也再次使忠於材料本質與特性的精神回歸設計核心。本課程將聚焦於「木框架／實木」、「竹」、「稻草」、「軟木」、「夯土」、「磚」、「石材」等植物基與低碳材料，探討其於當代建築與空間設計中的應用可能。課程將從封閉式材料循環（Closed-Loop Material Cycles）與永續設計觀點出發，透過國內外案例分析，說明不同材料之構造系統、材料細節與製造邏輯，並進一步探討其與場域脈絡、地方文化及永續經濟性之間的關聯，建立同學對於材料、構築與環境之整合性理解。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/115/1/366736"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.n
