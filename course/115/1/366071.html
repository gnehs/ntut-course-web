    <title>𝟯𝟲𝟲𝟬𝟳𝟭 數據啟發設計思考</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="「數據啟發設計思考（Data-informed Design Thinking）」課程旨在結合數據分析與設計思考，通過實踐項目提升學生在現代設計環境中的問題解決能力。本課程將引導學生掌握如何從數據中提取關鍵洞察，並結合設計思考中的使用者需求、創意思考與解決方案原型的開發。學生將學習如何有效地應用數據，來支持設計決策與創新。課程以 Project-Based Learning 為教學模式，學生將在實際設計項目中探索如何將數據與設計思考相結合，最終交付一個完整的數據驅動設計解決方案與數據視覺化。這門課不僅培養學生的技術技能，還強調協作、反思與迭代改進的設計思考過程，幫助學生為未來數據密集型的設計環境做好準備。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟲𝟲𝟬𝟳𝟭 數據啟發設計思考"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="「數據啟發設計思考（Data-informed Design Thinking）」課程旨在結合數據分析與設計思考，通過實踐項目提升學生在現代設計環境中的問題解決能力。本課程將引導學生掌握如何從數據中提取關鍵洞察，並結合設計思考中的使用者需求、創意思考與解決方案原型的開發。學生將學習如何有效地應用數據，來支持設計決策與創新。課程以 Project-Based Learning 為教學模式，學生將在實際設計項目中探索如何將數據與設計思考相結合，最終交付一個完整的數據驅動設計解決方案與數據視覺化。這門課不僅培養學生的技術技能，還強調協作、反思與迭代改進的設計思考過程，幫助學生為未來數據密集型的設計環境做好準備。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/115/1/366071"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=115&sem=1&id=366071"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" re
