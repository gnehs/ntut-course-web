    <title>𝟴𝟯𝟬𝟰𝟯 教學媒體與操作</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="在目前資訊爆增的社會中，從事教學工作確實不是一件很輕鬆的工作。當今國內的教育方式是大量的資訊必須利用有限的時間，在指定的空間內，傳播給必須接受者。此一工作勢必要借助於相當妥善的媒介或手段才能做到。因此，從事教育工作者如何研究和運用適切的媒體來教學已成為不可忽視的課題。本課程的重點在介紹教學媒體的涵義、分類與功能、如何進行教學傳播，以及媒體教學的基本理論。 本課程擬培養之核心能力與指標： 2-1具備課程與教學設計能力。2-2具備善用教學策略進行有效教學之能力。2-3具備運用適切方法進行學習評量之能力。(各項指標內容請點連結詳閱了解)"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟴𝟯𝟬𝟰𝟯 教學媒體與操作"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="在目前資訊爆增的社會中，從事教學工作確實不是一件很輕鬆的工作。當今國內的教育方式是大量的資訊必須利用有限的時間，在指定的空間內，傳播給必須接受者。此一工作勢必要借助於相當妥善的媒介或手段才能做到。因此，從事教育工作者如何研究和運用適切的媒體來教學已成為不可忽視的課題。本課程的重點在介紹教學媒體的涵義、分類與功能、如何進行教學傳播，以及媒體教學的基本理論。 本課程擬培養之核心能力與指標： 2-1具備課程與教學設計能力。2-2具備善用教學策略進行有效教學之能力。2-3具備運用適切方法進行學習評量之能力。(各項指標內容請點連結詳閱了解)"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/93/2/83043"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=93&sem=2&id=83043"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;
