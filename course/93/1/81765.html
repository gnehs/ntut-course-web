    <title>𝟴𝟭𝟳𝟲𝟱 工業心理學</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程的目標在培養有效率的工業人才。包括生產、分配、消費財貨與勞務的各部門，無論是新進的員工或最高層的經理，如要請求效率，則定須具備本門知識。本課程分四方面：（一）、人事心理，包括工作分析，人事選用程序及方法，人事測驗原理及應用，工作考核，員工訓練，工作評價；（二）、組織社會心理，包括動機理論與管理，態度與士氣的測量，組織理論與人行為，領導行為，員工參與，意見溝通；（三）、工程心理，包括工作環境與工作效率，機械設備與工作設計，意外防止與工業安全；（四）、消費心理，包括消費行為，廣告宣傳。上課方式包含講授，討論個人習作等。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟴𝟭𝟳𝟲𝟱 工業心理學"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程的目標在培養有效率的工業人才。包括生產、分配、消費財貨與勞務的各部門，無論是新進的員工或最高層的經理，如要請求效率，則定須具備本門知識。本課程分四方面：（一）、人事心理，包括工作分析，人事選用程序及方法，人事測驗原理及應用，工作考核，員工訓練，工作評價；（二）、組織社會心理，包括動機理論與管理，態度與士氣的測量，組織理論與人行為，領導行為，員工參與，意見溝通；（三）、工程心理，包括工作環境與工作效率，機械設備與工作設計，意外防止與工業安全；（四）、消費心理，包括消費行為，廣告宣傳。上課方式包含講授，討論個人習作等。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/93/1/81765"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=93&sem=1&id=81765"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Rob
