    <title>𝟯𝟱𝟮𝟬𝟳𝟳 生成式 AI 設計實務應用</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程旨在培養學生成為能夠熟練運用生成式 AI 技術的新時代設計師。通過深入學習生成式 AI 的基本原理與應用，學生將掌握各種 AI 輔助設計工具，如 ChatGPT、Midjourney 等。課程重點培養學生的提示工程技能，使其能夠有效引導 AI 工具產生所需的設計成果。課程致力於幫助學生將 AI 技術整合到傳統設計流程中，同時 AI 輔助程式設計和網頁開發等實踐培養跨領域能力。課程鼓勵創新思維，激發學生探索 AI 技術在設計領域的創新應用。通過小組專案，學生將培養團隊合作精神和專案管理能力。另一方面，注重培養學生對 AI 技術應用的倫理意識，以及持續學習的能力，使其能夠在快速發展的 AI 技術領域中保持競爭力。總體而言，本課程旨在全面提升學生在 AI 時代的設計能力，為他們在數位化轉型的職場中做好充分準備。學生將學習：1. AI 素養 2. 運用生成式 AI 工具進行設計創作 3. 編寫有效的提示以引導 AI 生成所需內容 4. 利用 AI 技術進行圖像和 3D 生成 5. 將 AI 工具整合到現有設計工作流程中 6. 使用 AI 輔助程式設計並完成小專案 7. 評估和應對 AI 應用中的道德和法律問題"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟱𝟮𝟬𝟳𝟳 生成式 AI 設計實務應用"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程旨在培養學生成為能夠熟練運用生成式 AI 技術的新時代設計師。通過深入學習生成式 AI 的基本原理與應用，學生將掌握各種 AI 輔助設計工具，如 ChatGPT、Midjourney 等。課程重點培養學生的提示工程技能，使其能夠有效引導 AI 工具產生所需的設計成果。課程致力於幫助學生將 AI 技術整合到傳統設計流程中，同時 AI 輔助程式設計和網頁開發等實踐培養跨領域能力。課程鼓勵創新思維，激發學生探索 AI 技術在設計領域的創新應用。通過小組專案，學生將培養團隊合作精神和專案管理能力。另一方面，注重培養學生對 AI 技術應用的倫理意識，以及持續學習的能力，使其能夠在快速發展的 AI 技術領域中保持競爭力。總體而言，本課程旨在全面提升學生在 AI 時代的設計能力，為他們在數位化轉型的職場中做好充分準備。學生將學習：1. AI 素養 2. 運用生成式 AI 工具進行設計創作 3. 編寫有效的提示以引導 AI 生成所需內容 4. 利用 AI 技術進行圖像和 3D 生成 5. 將 AI 工具整合到現有設計工作流程中 6. 使用 AI 輔助程式設計並完成小專案 7. 評估和應對 AI 應用中的道德和法律問題"><meta data-n-head="1" dat
