    <title>𝟯𝟱𝟵𝟳𝟲𝟲 機器學習</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="機器學習探討如何能由觀測到的資料中自我學習，自我進化，而能自動增進其處理效能。例如進行預測，特徵擷取，分類，模式辨認，決策，各種訊號處理，甚至建立人工智慧等等。本課程將介紹機器學習的基礎演算法、理論及工具。並讓學生嘗試在各種領域中實際實踐這些技術。課程內容包括：(a) 監督式學習（例如參數和非參數演算法、支持向量機和類神經網路等），(b) 無監督學習（例如群聚、降維和深度學習等）與 (c) 機器學習應用實例（例如語音信號處理，影像訊號處理，音訊訊號處理與自然語言處理，資訊擷取與資料搜尋等）。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟱𝟵𝟳𝟲𝟲 機器學習"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="機器學習探討如何能由觀測到的資料中自我學習，自我進化，而能自動增進其處理效能。例如進行預測，特徵擷取，分類，模式辨認，決策，各種訊號處理，甚至建立人工智慧等等。本課程將介紹機器學習的基礎演算法、理論及工具。並讓學生嘗試在各種領域中實際實踐這些技術。課程內容包括：(a) 監督式學習（例如參數和非參數演算法、支持向量機和類神經網路等），(b) 無監督學習（例如群聚、降維和深度學習等）與 (c) 機器學習應用實例（例如語音信號處理，影像訊號處理，音訊訊號處理與自然語言處理，資訊擷取與資料搜尋等）。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/114/2/359766"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=114&sem=2&id=359766"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Condensed:wght@400;700
