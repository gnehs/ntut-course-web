<!DOCTYPE html><html lang="zh-TW" data-n-head="%7B%22lang%22:%7B%221%22:%22zh-TW%22%7D%7D"><head>
    <title>𝟱𝟰𝟮𝟮𝟰 班級經營</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程目標如下:(一)充實學生各種激發快樂學習、健康成長的學識，以培養適任的優良教師；（二）提供學生班級教學及班級導師工作的實務經驗與做法，使具備有效處理教學與班級事務的良好技能﹔(三)奠定學生熱忱積極經營班級之理念，養成學生教育專業精神，使其在從事教育工作時能發揮愛心與熱忱來欣賞及參與班級的各種活動。 本課程的內容涵蓋班級經營的學理基礎;班級經營的目標、計劃與評鑑;教學、行政之經營;導師的任務與素養;學生自治活動、教學情境佈置;班級氣氛與學習;班級的評量設計;有關安置、生活、學習、行為等方面的問題與對策等 本課程利用講授法、小組討論法、發表法等方式進行教學，盡量在教學過程中探討教室內各種發生的狀況尋求最佳解決方式，且進行發展積極、和諧、快樂的師生互動模式之探討以利學生在未來擔任教師時能駕輕就熟於班級經營工作，而達成本課程之目標 本課程擬培養之核心能力與指標：1-1具備教育專業知識並掌握重要教育議題之能力。3-1具備發揮班級經營效能營造支持性學習環境之能力。3-2具備掌握學生差異進行相關輔導之能力。4-2具備展現協作與領導之能力。5-1具備致力教師專業成長之能力。(備註：本資料係由本校各教學單位、教務處課務組、進修部教務組、進修學院教務組及計網中心所共同提供！本資料僅供參考，正式資料仍以教務處、進修部、進修學院所公佈之書面資料為準。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟱𝟰𝟮𝟮𝟰 班級經營"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程目標如下:(一)充實學生各種激發快樂學習、健康成長的學識，以培養適任的優良教師；（二）提供學生班級教學及班級導師工作的實務經驗與做法，使具備有效處理教學與班級事務的良好技能﹔(三)奠定學生熱忱積極經營班級之理念，養成學生教育專業精神，使其在從事教育工作時能發揮愛心與熱忱來欣賞及參與班級的各種活動。 本課程的內容涵蓋班級經營的學理基礎;班級經營的目標、計劃與評鑑;教學、行政之經營;導師的任務與素養;學生自治活動、教學情境佈置;班級氣氛與學習;班級的評量設計;有關安置、生活、學習、行為等方面的問題與對策等 本課程利用講授法、小組討論法、發表法等方式進行教學，盡量在教學過程中探討教室內各種發生的狀況尋求最佳解決方式，且進行發展積極、和諧、快樂的師生互動模式之探討以利學生在未來擔任教師時能駕輕就熟於班級經營工作，而達成本課程之目標 本課程擬培養之核心能力與指標：1-1具備教育專業知識並掌握重要教育議題之能力。3-1具備發揮班級經營效能營造支持性學習環境之能力。3-2具備掌握學生差異進行相關輔導之能力。4-2具備展現協作與領導之能力。5-1具備致力教師專業成長之能力。(備註：本
