    <title>𝟮𝟱𝟴𝟵𝟴𝟲 設計思考與資料科學</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="使用者導向之設計已成為大多數互動設計的依循主軸。他翻轉了以產品為導向的傳統，強調以使用者的偏好引領設計的價值。而這就是設計思考的方法導入互動設計中，利用其敏感性和方法，透過可行及可用的技術滿足使用者的需求，從而產生使用者價值並發展市場機會。研究建議，由世界級的設計公司IDEO所主導，設計思考與決策科學相結合，觸發了同理心設計與工程技術的融合。這不僅可以確保提出兼容實際性和創造性地問題解決方案外，而且在設計的開始便融入使用者導向的設計概念，將有助於創新設計與解決方案的提出。同時，在設計的初始階段導入資料應用與分析的方法，更能在設計中正確的整合敏感性，技術可行性，商轉可行性和使用者的需求。本課程主要的概念在於利用設計思考以使用者導向之設計方法，將使用者及其需求作為設計提案以及解決方案的啟始點，並整合分析設計對象，使用者所遭遇的問題，以及如何提高性能以及實現可擴展性等問題。並透過資料科學與工具的整合應用，導引資料分析人員與設計專業人員進行跨領域的整合，以建構未來設計創新的機會與願景。因此，本課程的主要目標是：1.建構以用戶為導向之人本設計重要設計流程。2.使用高品質的數據，可以創建設計工件，"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟱𝟴𝟵𝟴𝟲 設計思考與資料科學"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="使用者導向之設計已成為大多數互動設計的依循主軸。他翻轉了以產品為導向的傳統，強調以使用者的偏好引領設計的價值。而這就是設計思考的方法導入互動設計中，利用其敏感性和方法，透過可行及可用的技術滿足使用者的需求，從而產生使用者價值並發展市場機會。研究建議，由世界級的設計公司IDEO所主導，設計思考與決策科學相結合，觸發了同理心設計與工程技術的融合。這不僅可以確保提出兼容實際性和創造性地問題解決方案外，而且在設計的開始便融入使用者導向的設計概念，將有助於創新設計與解決方案的提出。同時，在設計的初始階段導入資料應用與分析的方法，更能在設計中正確的整合敏感性，技術可行性，商轉可行性和使用者的需求。本課程主要的概念在於利用設計思考以使用者導向之設計方法，將使用者及其需求作為設計提案以及解決方案的啟始點，並整合分析設計對象，使用者所遭遇的問題，以及如何提高性能以及實現可擴展性等問題。並透過資料科學與工具的整合應用，導引資料分析人員與設計專業人員進行跨領域的整合，以建構未來設計創新的機會與願景。因此，本課程的主要目標是：1.建構以用戶為導向之人本設計重要設計流程。2.使用高品質的數據，可以創建設計工件，"><meta data-n-head="1" data-hid="og:url" name="og:url" p
