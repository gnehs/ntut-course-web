    <title>𝟭𝟯𝟰𝟰𝟭𝟬 中古世紀與二十一世紀文化應用</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="馬克吐溫筆下，十九世紀的美國佬造訪了亞瑟王的宮廷；一百年後，差不多就是美國總統甘迺迪將白宮稱為「卡美樂」(亞瑟王的皇城)的同時，倫敦和紐約的地鐵車站的塗鴉寫著:「佛羅多萬歲」。時至今日，業界為了增加生產力，選擇在具有中古風味的地方舉辦員工休閒活動兼凝聚向心力，有的派遣員工參加討論如何在職場發揚騎士精神的研討會。為什麼? 就廣義的定義來看，中古世紀就是羅馬帝國衰亡後到十五世紀義大利文藝復興這段時期。我們依據文藝復興時期的觀點，認為那是一段未經啟蒙，缺乏知識，尚未現代化的時期，將它稱為「黑暗時代」。但是，有關這段黑暗時期的故事-亞瑟王和圓桌武士、聖杯、巨龍和公主等-卻一直流傳下來，歷久不衰，經過文藝復興時期，傳到啟蒙時代，甚至一直流傳到後現代主義的今天。透過主流(如好萊塢熱門影片中有關亞瑟王、貝奧武夫、以及托爾金另類中古世界的英雄)和非主流(如報章雜誌出現「聖杯」一詞的頻率和各種引伸用法)的管道，中古世界的意象不斷出現在西方的產品和論述中。本課程將檢視「現代中古」這一個弔詭的現象，探討現代西方如何借用、尊崇、重寫古老的中古世界，讓它在小說、電影、以及線上遊戲的虛擬空間中復活，形成了一種奇特而蓬勃的文"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟯𝟰𝟰𝟭𝟬 中古世紀與二十一世紀文化應用"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="馬克吐溫筆下，十九世紀的美國佬造訪了亞瑟王的宮廷；一百年後，差不多就是美國總統甘迺迪將白宮稱為「卡美樂」(亞瑟王的皇城)的同時，倫敦和紐約的地鐵車站的塗鴉寫著:「佛羅多萬歲」。時至今日，業界為了增加生產力，選擇在具有中古風味的地方舉辦員工休閒活動兼凝聚向心力，有的派遣員工參加討論如何在職場發揚騎士精神的研討會。為什麼? 就廣義的定義來看，中古世紀就是羅馬帝國衰亡後到十五世紀義大利文藝復興這段時期。我們依據文藝復興時期的觀點，認為那是一段未經啟蒙，缺乏知識，尚未現代化的時期，將它稱為「黑暗時代」。但是，有關這段黑暗時期的故事-亞瑟王和圓桌武士、聖杯、巨龍和公主等-卻一直流傳下來，歷久不衰，經過文藝復興時期，傳到啟蒙時代，甚至一直流傳到後現代主義的今天。透過主流(如好萊塢熱門影片中有關亞瑟王、貝奧武夫、以及托爾金另類中古世界的英雄)和非主流(如報章雜誌出現「聖杯」一詞的頻率和各種引伸用法)的管道，中古世界的意象不斷出現在西方的產品和論述中。本課程將檢視「現代中古」這一個弔詭的現象，探討現代西方如何借用、尊崇、重寫古老的中古世界，讓它在小說、電影、以及線上遊戲的虛擬空間中復活，形成了一種奇特而蓬勃的文"><meta data-n-head="1" data-hid="og:
