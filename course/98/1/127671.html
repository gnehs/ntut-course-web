<!DOCTYPE html><html lang="zh-TW" data-n-head="%7B%22lang%22:%7B%221%22:%22zh-TW%22%7D%7D"><head>
    <title>𝟭𝟮𝟳𝟲𝟳𝟭 科技與現代文學</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="科學與技術是了解這個世界和我們自己一項強而有力的工具，而許多作家們對於這樣的情況也在他們的作品中給予各式各樣的回應。在這個課程中我們將學習到作家們如何在他們的作品中使用文學藝術技巧來詮釋與解讀科技與現代文學的相互作用；人類與大自然的關係；以及人類當前的處境。修習這門課程的學生並不需要具備對科學有嚴格的基礎訓練與知識，只要具備強烈的好奇心和求知慾。在課程的一開始我們將藉由閱讀相關作品讓大家熟悉一些重要的議題。課程的中心主題除了針對科學技術與文學的相互關係外，我們也將焦點放在分析文學作品上。我們將繼續探索文學形式與內容的關聯。同時，我們也將利用現代科技在課堂上練習文學作品的即興創作。學生們一開始分析一段正文的內容。然後他們利用這些片段重新組合成一篇新的文本。接著，在這些文本內建立新的超連結︰每當文本被閱讀時，讀者能有多種選擇來閱讀並且使正文成為一個完全新的實體。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟮𝟳𝟲𝟳𝟭 科技與現代文學"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="科學與技術是了解這個世界和我們自己一項強而有力的工具，而許多作家們對於這樣的情況也在他們的作品中給予各式各樣的回應。在這個課程中我們將學習到作家們如何在他們的作品中使用文學藝術技巧來詮釋與解讀科技與現代文學的相互作用；人類與大自然的關係；以及人類當前的處境。修習這門課程的學生並不需要具備對科學有嚴格的基礎訓練與知識，只要具備強烈的好奇心和求知慾。在課程的一開始我們將藉由閱讀相關作品讓大家熟悉一些重要的議題。課程的中心主題除了針對科學技術與文學的相互關係外，我們也將焦點放在分析文學作品上。我們將繼續探索文學形式與內容的關聯。同時，我們也將利用現代科技在課堂上練習文學作品的即興創作。學生們一開始分析一段正文的內容。然後他們利用這些片段重新組合成一篇新的文本。接著，在這些文本內建立新的超連結︰每當文本被閱讀時，讀者能有多種選擇來閱讀並且使正文成為一個完全新的實體。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/98/1/127671"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=98&sem=1&id=127671"><link data-
