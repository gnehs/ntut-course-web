    <title>𝟭𝟯𝟴𝟮𝟳𝟴 管理軟體應用</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="本課程針對電腦初學者所設計，課程依照初學者最需要的電腦入門知識和技能，從基本的網路原理及、網路資源教起，讓同學可以充份掌握並利用並利用網路資源。本課程亦教授網頁編輯觀念教您如何規劃網站架構、再加上互動式表單及動態網頁效果的完整說明,讓同學也能製作出具有專業水準的網站。本課程分為「電腦基礎」和「網際網路」等二部份：(1) 電腦基礎篇：介紹最熱門的網路觀念與操作技巧，內容涵括知識性的網路相關知識，包括網路與Internet發展，以及資訊安全等題材；另外還有操作性的課題，包括WWW與網路搜尋、E-mail電子郵件、HTML網頁製作、FTP檔案傳輸與網站發佈等；學會上網找資料、收發電子郵件、使用即時通訊軟體。(2) 網際網路篇：學會製作個人網頁等技巧。製作網頁以FrontPage中文版的各項基本功能為主，內容包括網站的建立、圖文網頁編輯、表格與超連結、導覽列與共用邊框、分割框架與多媒體互動網頁設計，以及網站的發佈與管理等，讓同學可以完整學習利用FrontPage來編製網頁的編輯技巧。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟯𝟴𝟮𝟳𝟴 管理軟體應用"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="本課程針對電腦初學者所設計，課程依照初學者最需要的電腦入門知識和技能，從基本的網路原理及、網路資源教起，讓同學可以充份掌握並利用並利用網路資源。本課程亦教授網頁編輯觀念教您如何規劃網站架構、再加上互動式表單及動態網頁效果的完整說明,讓同學也能製作出具有專業水準的網站。本課程分為「電腦基礎」和「網際網路」等二部份：(1) 電腦基礎篇：介紹最熱門的網路觀念與操作技巧，內容涵括知識性的網路相關知識，包括網路與Internet發展，以及資訊安全等題材；另外還有操作性的課題，包括WWW與網路搜尋、E-mail電子郵件、HTML網頁製作、FTP檔案傳輸與網站發佈等；學會上網找資料、收發電子郵件、使用即時通訊軟體。(2) 網際網路篇：學會製作個人網頁等技巧。製作網頁以FrontPage中文版的各項基本功能為主，內容包括網站的建立、圖文網頁編輯、表格與超連結、導覽列與共用邊框、分割框架與多媒體互動網頁設計，以及網站的發佈與管理等，讓同學可以完整學習利用FrontPage來編製網頁的編輯技巧。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/99/1/138278"><meta data-n-head="1" data-hid="og:image"
