    <title>𝟭𝟴𝟯𝟭𝟲𝟭 逆向工程研究</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="逆向工程已成為電腦輔助產品開發技術重要的一環，透過三次元量測或掃瞄技術，取得工件表面的點資料，據以建構3D CAD幾何模型(Geometric model)，以供後續設計、電腦輔助工程分析(CAE)與電腦輔助製造(CAM)之應用。逆向工程的程序分為三個階段：(1)擷取工件表面的點資料；(2)點資料的前置處理；以及(3)建構或更新幾何模型。依此流程，本課程首先講述各類運用於逆向工程中的量測與掃瞄技術，並以設計應用觀點為基礎，討論其間的差異與優缺點，隨著運用領域的不同，而採取不同的量測技術；其次介紹點資料前置處理的理念與方法，從現有文獻中，解析的相關的技術，因量測技術與策略的差異，而發展出不同的處理技術；至於，重建或更新原有的幾何模型的部分，將著重設計實務的應用，並與現有的CAD系統整合的策略。課程之目標，為使修習本課程之學生能對逆向工程的相關理論與技術，有全盤的認識與瞭解，並透過實際案例的操作，訓練學生能具備實務作業能力。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟴𝟯𝟭𝟲𝟭 逆向工程研究"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="逆向工程已成為電腦輔助產品開發技術重要的一環，透過三次元量測或掃瞄技術，取得工件表面的點資料，據以建構3D CAD幾何模型(Geometric model)，以供後續設計、電腦輔助工程分析(CAE)與電腦輔助製造(CAM)之應用。逆向工程的程序分為三個階段：(1)擷取工件表面的點資料；(2)點資料的前置處理；以及(3)建構或更新幾何模型。依此流程，本課程首先講述各類運用於逆向工程中的量測與掃瞄技術，並以設計應用觀點為基礎，討論其間的差異與優缺點，隨著運用領域的不同，而採取不同的量測技術；其次介紹點資料前置處理的理念與方法，從現有文獻中，解析的相關的技術，因量測技術與策略的差異，而發展出不同的處理技術；至於，重建或更新原有的幾何模型的部分，將著重設計實務的應用，並與現有的CAD系統整合的策略。課程之目標，為使修習本課程之學生能對逆向工程的相關理論與技術，有全盤的認識與瞭解，並透過實際案例的操作，訓練學生能具備實務作業能力。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/102/2/183161"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://nt
