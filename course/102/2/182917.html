    <title>𝟭𝟴𝟮𝟵𝟭𝟳 城市災害管理與重建專題</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="近來全球氣候異常變遷，對人類生活環境影響甚鉅；臺灣是天然災害發生最頻繁的地區，建築與規劃專業人員必需及早養成以規劃設計達到減災防災的災害防救意識與專業素養。本課程目的在強化建築與都市規劃專業對環境變遷與災害防治融入規劃設計知識與應變的能力；藉由國內外文獻探討、個案研究、課程研討與專家座談等方法，以區域生命共同體觀點，針對建築及都市規劃災害管理相關的災害種攞、減災型態的建築計畫與土地使用規劃、災害防救體系、環境變遷及衍生議題、資源配置、複合型災害衝擊、因應氣候變遷之災害調適策略與機制、災後安置、產業復甦與社區重建等有深入的探討，期能藉助設計與規劃保障生命財產安全。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟴𝟮𝟵𝟭𝟳 城市災害管理與重建專題"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="近來全球氣候異常變遷，對人類生活環境影響甚鉅；臺灣是天然災害發生最頻繁的地區，建築與規劃專業人員必需及早養成以規劃設計達到減災防災的災害防救意識與專業素養。本課程目的在強化建築與都市規劃專業對環境變遷與災害防治融入規劃設計知識與應變的能力；藉由國內外文獻探討、個案研究、課程研討與專家座談等方法，以區域生命共同體觀點，針對建築及都市規劃災害管理相關的災害種攞、減災型態的建築計畫與土地使用規劃、災害防救體系、環境變遷及衍生議題、資源配置、複合型災害衝擊、因應氣候變遷之災害調適策略與機制、災後安置、產業復甦與社區重建等有深入的探討，期能藉助設計與規劃保障生命財產安全。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/102/2/182917"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=102&sem=2&id=182917"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.goo
