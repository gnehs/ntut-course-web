    <title>𝟭𝟵𝟵𝟳𝟲𝟬 全球化之衝突與共生</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="21世紀全球化浪潮席捲人類生活各個領域，國家邊界正在消失，人們都是「地球村」的村民，並且已逐漸體認到無論是政治、經濟、文化或社會層面都受其他村民的影響。本課題擬從以上四個視角協助同學認知全球化問題，從而構思(總體面)國家的發展策略以及(個體面)企業的經營佈局對策。課程內容包括：全球化與國家主權(國家認同、國家職能)、全球化與國際分工(跨國公司、利益分配)、全球化與文明衝突(文化帝國、民族主義)、全球化與社會風險(公民社會、社會安全)、全球化與全球治理(秩序重建、利益共容)。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟭𝟵𝟵𝟳𝟲𝟬 全球化之衝突與共生"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="21世紀全球化浪潮席捲人類生活各個領域，國家邊界正在消失，人們都是「地球村」的村民，並且已逐漸體認到無論是政治、經濟、文化或社會層面都受其他村民的影響。本課題擬從以上四個視角協助同學認知全球化問題，從而構思(總體面)國家的發展策略以及(個體面)企業的經營佈局對策。課程內容包括：全球化與國家主權(國家認同、國家職能)、全球化與國際分工(跨國公司、利益分配)、全球化與文明衝突(文化帝國、民族主義)、全球化與社會風險(公民社會、社會安全)、全球化與全球治理(秩序重建、利益共容)。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/103/1/199760"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=103&sem=1&id=199760"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link data-n-head="1" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto+Condensed:wght@400;700&family=
