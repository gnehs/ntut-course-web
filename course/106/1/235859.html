    <title>𝟮𝟯𝟱𝟴𝟱𝟵 同步工程研究</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="數位革命時代的來臨，CAD/CAE/CAM/PDM也是資訊科技的產物，相關技術的整合與應用已普遍實踐於產品開發，藉由資訊科技建立「資料一元化」的數位設計環境，打破傳統產品開發的溝通障礙與隔閡，整合跨機能的設計團隊，達成「同步工程」的理想，才能因應全球產業快速的變革。電腦輔助技術不僅是新的設計工具，其更深層的意義是產品開發體系的整體運作與管理方式也受到此一新技術影響，需有合理合適的管理架構與設計程序配合，才能有效運用，創造出其應有的價值。本課程將先探討資訊科技的原理與發展趨勢，以及分析產品設計模式與設計活動的特質，進而瞭解資訊科技對產品開發的衝擊與影響；然後以實際案例透過數位化設計技術，有效縮短產品開發時程，實現同步工程的理想。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟮𝟯𝟱𝟴𝟱𝟵 同步工程研究"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="數位革命時代的來臨，CAD/CAE/CAM/PDM也是資訊科技的產物，相關技術的整合與應用已普遍實踐於產品開發，藉由資訊科技建立「資料一元化」的數位設計環境，打破傳統產品開發的溝通障礙與隔閡，整合跨機能的設計團隊，達成「同步工程」的理想，才能因應全球產業快速的變革。電腦輔助技術不僅是新的設計工具，其更深層的意義是產品開發體系的整體運作與管理方式也受到此一新技術影響，需有合理合適的管理架構與設計程序配合，才能有效運用，創造出其應有的價值。本課程將先探討資訊科技的原理與發展趨勢，以及分析產品設計模式與設計活動的特質，進而瞭解資訊科技對產品開發的衝擊與影響；然後以實際案例透過數位化設計技術，有效縮短產品開發時程，實現同步工程的理想。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/106/1/235859"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=106&sem=1&id=235859"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="https://fonts.gstatic.com"><link
