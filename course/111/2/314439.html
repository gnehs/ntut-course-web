    <title>𝟯𝟭𝟰𝟰𝟯𝟵 精準醫療特論</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="精準醫療 (Precision Medicine) 又稱為個人化醫療，該詞最早於 2011 年由美國國家研究委員會所提出，意指除了藉由傳統診斷方法如病患症狀描述及常規生化、影像檢查之外，加上新式生物醫學檢測如基因檢測等，並整合個人資料，如性別、身高、體重、種族、基因特異性、過去病史、家族病史等完整綜合信息，透過人體基因資料庫進行比對及分析，進而藉以選出最適合病患的治療方法及藥物治 療，如細胞治療、基因治療和標靶治療等。精準醫療最終的目的是希望透過個體差異性的深入診斷，來找出治療效果最大化及副作用最小化的最佳個人化醫療方案。2015 年美國前總統歐巴馬在國情咨文演講中提出「精準醫學計畫 (Precision Medicine Initiative)」， 率先投入二億美元以建立百萬人次的醫療記錄、基因、生活習慣等數據資料庫，並找尋誘發癌症的基因及相應新藥開發，訂定相關法規並 研究如何保護隱私與個資安全。此後各國無不競相投入精準醫療之發展，精準醫療也是當前台灣生技重點產業之一。開課綱要：本課程希望增進同學對精準醫療領域發展的認識與理解，上課內容涵蓋：精準醫療紹介、基因檢測發展及其應用、基因晶片發展及其應用、次世代定序發展及其應用、基因治療發展及其應用、伴隨診斷及"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟭𝟰𝟰𝟯𝟵 精準醫療特論"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="精準醫療 (Precision Medicine) 又稱為個人化醫療，該詞最早於 2011 年由美國國家研究委員會所提出，意指除了藉由傳統診斷方法如病患症狀描述及常規生化、影像檢查之外，加上新式生物醫學檢測如基因檢測等，並整合個人資料，如性別、身高、體重、種族、基因特異性、過去病史、家族病史等完整綜合信息，透過人體基因資料庫進行比對及分析，進而藉以選出最適合病患的治療方法及藥物治 療，如細胞治療、基因治療和標靶治療等。精準醫療最終的目的是希望透過個體差異性的深入診斷，來找出治療效果最大化及副作用最小化的最佳個人化醫療方案。2015 年美國前總統歐巴馬在國情咨文演講中提出「精準醫學計畫 (Precision Medicine Initiative)」， 率先投入二億美元以建立百萬人次的醫療記錄、基因、生活習慣等數據資料庫，並找尋誘發癌症的基因及相應新藥開發，訂定相關法規並 研究如何保護隱私與個資安全。此後各國無不競相投入精準醫療之發展，精準醫療也是當前台灣生技重點產業之一。開課綱要：本課程希望增進同學對精準醫療領域發展的認識與理解，上課內容涵蓋：精準醫療紹介、基因檢測發展及其應用、基因晶片發展及其應用、次世代定序發展及其應用、基因治療發展及
