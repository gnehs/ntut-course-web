    <title>𝟯𝟰𝟱𝟳𝟯𝟵 黃光微影製程材料及缺陷控制技術</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="半導體黃光微影技術是先進半導體製程的關鍵之一。如何優化曝光的光學系統和成像光阻的化學系統，以及控制顯影成像後的不良粒子缺陷，是決定先進半導體成敗與良率的關鍵。本課程涵蓋黃光微影技術的基本原理、步驟和光阻材料的組成，讓學員獲得整體性概念，了解黃光微影技術在晶圓製造中的角色及其對良率的影響。通過實際案例的介紹與演練，學員能更清楚地掌握專業背景知識並學以致用，培養半導體產業所需的技能，提升未來就業基礎與創新能力。課程將分為三個階段進行。第一階段介紹微影製程的基本原理及光阻材料，幫助學員累積研發與解決問題的專業知識。第二階段通過應用和實戰案例解析，使學員了解產業運作中的實際知識與技巧，並培養從微觀角度理解與思考問題的能力，提升自學效率與興趣。第三階段以模擬演練的方式，協助學員建立問題解決的技巧，增強他們的能力與信心。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟰𝟱𝟳𝟯𝟵 黃光微影製程材料及缺陷控制技術"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="半導體黃光微影技術是先進半導體製程的關鍵之一。如何優化曝光的光學系統和成像光阻的化學系統，以及控制顯影成像後的不良粒子缺陷，是決定先進半導體成敗與良率的關鍵。本課程涵蓋黃光微影技術的基本原理、步驟和光阻材料的組成，讓學員獲得整體性概念，了解黃光微影技術在晶圓製造中的角色及其對良率的影響。通過實際案例的介紹與演練，學員能更清楚地掌握專業背景知識並學以致用，培養半導體產業所需的技能，提升未來就業基礎與創新能力。課程將分為三個階段進行。第一階段介紹微影製程的基本原理及光阻材料，幫助學員累積研發與解決問題的專業知識。第二階段通過應用和實戰案例解析，使學員了解產業運作中的實際知識與技巧，並培養從微觀角度理解與思考問題的能力，提升自學效率與興趣。第三階段以模擬演練的方式，協助學員建立問題解決的技巧，增強他們的能力與信心。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/113/2/345739"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=113&sem=2&id=345739"><link data-n-head="1" rel="icon" type="imag
