    <title>𝟯𝟯𝟴𝟳𝟬𝟰 世界遺產思潮</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="聯合國教科文組織於 1972 年通過了《世界遺產公約》，旨在保護世界文化和自然遺產，並將保護和保存文化財產的概念連結起來。五十年來，世界遺產經歷多次變革，觀念與行動與時俱進，1992 年，文化景觀概念正式確立，承認人與環境的相互作用和共生關係，縫合了長街以來自然和文化的割裂。2001 年，全球文化多樣性宣言的通過，文化在不同時代和不同地方具有各種不同的表現形式，這種多樣性的具體表現，構成人類各群體和各社會具有的獨特性和多樣化。受此影響，文化景觀、無形遺產、水下遺產、產業遺產、文化路徑、聖山遺產、天文遺產紛紛出現。本課程屬建築保存應用課程，將介紹不同主題的世界遺產案例，其目的除了引領同學認識世界遺產觀念及思潮變遷外，亦對國內文化資產保存的學習有所啟發與反省。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟯𝟴𝟳𝟬𝟰 世界遺產思潮"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="聯合國教科文組織於 1972 年通過了《世界遺產公約》，旨在保護世界文化和自然遺產，並將保護和保存文化財產的概念連結起來。五十年來，世界遺產經歷多次變革，觀念與行動與時俱進，1992 年，文化景觀概念正式確立，承認人與環境的相互作用和共生關係，縫合了長街以來自然和文化的割裂。2001 年，全球文化多樣性宣言的通過，文化在不同時代和不同地方具有各種不同的表現形式，這種多樣性的具體表現，構成人類各群體和各社會具有的獨特性和多樣化。受此影響，文化景觀、無形遺產、水下遺產、產業遺產、文化路徑、聖山遺產、天文遺產紛紛出現。本課程屬建築保存應用課程，將介紹不同主題的世界遺產案例，其目的除了引領同學認識世界遺產觀念及思潮變遷外，亦對國內文化資產保存的學習有所啟發與反省。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/113/1/338704"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gnehs.net/api?year=113&sem=1&id=338704"><link data-n-head="1" rel="icon" type="image/png" href="/icon.png"><link data-n-head="1" rel="preconnect" href="htt
