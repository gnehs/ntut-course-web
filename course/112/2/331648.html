    <title>𝟯𝟯𝟭𝟲𝟰𝟴 生物科技產品品質安全與管理法規</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="生物科技產業已是二十一世紀世界各國的重要產業，我國亦視生技產業為繼電子產業後的新興產業，然而生物科技產業與其他科技產業的差異，在於用於人體或具醫療用途的生技產品，除了品質管理外，更須考慮安全與效能，我國與世界各國對於生技產品大都以建置相當程度的法規環境，以有效的管理生技產品並確保人之安全。因此，對於生技產品特有的管理制度以及安全與效能等特殊需求若無正確的認識，將非常不利產業發展。本課程將以疫苗、血液製劑、基因工程製劑、診斷試劑、人體細胞組織產品等目前已研發成熟與正發展中的生技產品為例，從產品設計、品質與製程管制、效能與安全評估、法規環境與管理制度到我國管理方式，以深入淺出的方式做完整的介紹，此外，課程中也將針對生技產業面臨的生物安全問題及其需要的設施、生技產業的挑戰與機會等議題，進行充分的講述與討論。透過此課程，期望學生建立在生技產品品質管理、製程管制、安全評估及產品登記等方面的基本概念，以培養生技產業目前極度缺乏的製程規劃人材。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟯𝟭𝟲𝟰𝟴 生物科技產品品質安全與管理法規"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="生物科技產業已是二十一世紀世界各國的重要產業，我國亦視生技產業為繼電子產業後的新興產業，然而生物科技產業與其他科技產業的差異，在於用於人體或具醫療用途的生技產品，除了品質管理外，更須考慮安全與效能，我國與世界各國對於生技產品大都以建置相當程度的法規環境，以有效的管理生技產品並確保人之安全。因此，對於生技產品特有的管理制度以及安全與效能等特殊需求若無正確的認識，將非常不利產業發展。本課程將以疫苗、血液製劑、基因工程製劑、診斷試劑、人體細胞組織產品等目前已研發成熟與正發展中的生技產品為例，從產品設計、品質與製程管制、效能與安全評估、法規環境與管理制度到我國管理方式，以深入淺出的方式做完整的介紹，此外，課程中也將針對生技產業面臨的生物安全問題及其需要的設施、生技產業的挑戰與機會等議題，進行充分的講述與討論。透過此課程，期望學生建立在生技產品品質管理、製程管制、安全評估及產品登記等方面的基本概念，以培養生技產業目前極度缺乏的製程規劃人材。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/112/2/331648"><meta data-n-head="1" data-hid="og:image" name="og:image" property="o
