    <title>𝟯𝟯𝟭𝟯𝟴𝟬 人工智慧跨域經營管理之應用</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="中文概述 Chinese Description 	(1). 本課程將介紹人工智慧在各種經營管理領域的科技應用，包括：預測分析、客戶關係管理、資源優化、行銷和廣告、智慧客服、決策支援。(2). 學生能夠學到正確學習商業智能與資料科學的 3 個步驟：A. 使用 pandas 模組裡進行商業數據分析與視覺化。B. 用 numpy，sklearn 模組來處理迴歸分析等機器學習問題。C. 用 keras 深度學模組進行商業預測。(3). 本課程將讓著重在培養學生具有基礎的資料科學與數據分析能力，有能力使用 python 來做商業分析與視覺化，精通包括 pandas 與 matplotlib 模組。(4). 訓練學生精通商業數據程式分析，有能力處理資料的一體化分析，包括：數據採集、清洗、查詢與計算、分析與挖掘、可視化。(5). 訓練學生有能力處理採集各種大數據資料，包括：網頁爬取，json，xml，csv, excel，mySQL，noSQL (6). 本課程將探討各種案例，例如『業務銷售分析，淘寶電商數據分析，市場佔有率分析，系所生源分析，股票市場分析，問卷資料分析』。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟯𝟭𝟯𝟴𝟬 人工智慧跨域經營管理之應用"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="中文概述 Chinese Description 	(1). 本課程將介紹人工智慧在各種經營管理領域的科技應用，包括：預測分析、客戶關係管理、資源優化、行銷和廣告、智慧客服、決策支援。(2). 學生能夠學到正確學習商業智能與資料科學的 3 個步驟：A. 使用 pandas 模組裡進行商業數據分析與視覺化。B. 用 numpy，sklearn 模組來處理迴歸分析等機器學習問題。C. 用 keras 深度學模組進行商業預測。(3). 本課程將讓著重在培養學生具有基礎的資料科學與數據分析能力，有能力使用 python 來做商業分析與視覺化，精通包括 pandas 與 matplotlib 模組。(4). 訓練學生精通商業數據程式分析，有能力處理資料的一體化分析，包括：數據採集、清洗、查詢與計算、分析與挖掘、可視化。(5). 訓練學生有能力處理採集各種大數據資料，包括：網頁爬取，json，xml，csv, excel，mySQL，noSQL (6). 本課程將探討各種案例，例如『業務銷售分析，淘寶電商數據分析，市場佔有率分析，系所生源分析，股票市場分析，問卷資料分析』。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url"
