    <title>𝟯𝟮𝟰𝟳𝟮𝟮 病毒學概論</title><meta data-n-head="1" charset="utf-8"><meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"><meta data-n-head="1" data-hid="description" name="description" content="病毒可說是介於無生命和有生命之間的物質。它小至用光學顯微鏡看不見除非在電子顯微鏡下。儘管看不見卻無所不在，與人類關係異常密切。人類基因體約 8% 是從病毒來的。目前最難解決的傳染病問題也是由病毒引起。病毒結構看來似乎很簡單，但為了生存也進化出非凡的策略。人類從研究病毒得到非常多重要的知識和研究工具。讓我們能夠對分子、細胞和生物體的結構和功能得到更深地了解，進而對疾病問題得到解決。本課程將以深入簡出的方式讓同學認識病毒：從病毒的起源，病毒如何進入宿主細胞與複製，並在宿主群體間存活和傳播所必須具備的機制。通過一系列較具代表性的人類病毒為例子進行介紹病毒複製的基礎、人類與病毒的相互作用以及如何導致疾病。同時認識人體 4006 的疫系統如何對抗病毒。了解為什麼新興病毒的出現並造成疫情。人類應如何應對。最後介紹兩種不尋常的傳染因子 - 類病毒和狂牛病蛋白。它們與病毒似乎都是在生命起源中在化學演化時期殘留下來的分子。"><meta data-n-head="1" data-hid="charset" charset="utf-8"><meta data-n-head="1" data-hid="mobile-web-app-capable" name="mobile-web-app-capable" content="yes"><meta data-n-head="1" data-hid="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:type" name="og:type" property="og:type" content="website"><meta data-n-head="1" data-hid="og:title" name="og:title" property="og:title" content="𝟯𝟮𝟰𝟳𝟮𝟮 病毒學概論"><meta data-n-head="1" data-hid="og:site_name" name="og:site_name" property="og:site_name" content="北科課程好朋友"><meta data-n-head="1" data-hid="og:description" name="og:description" property="og:description" content="病毒可說是介於無生命和有生命之間的物質。它小至用光學顯微鏡看不見除非在電子顯微鏡下。儘管看不見卻無所不在，與人類關係異常密切。人類基因體約 8% 是從病毒來的。目前最難解決的傳染病問題也是由病毒引起。病毒結構看來似乎很簡單，但為了生存也進化出非凡的策略。人類從研究病毒得到非常多重要的知識和研究工具。讓我們能夠對分子、細胞和生物體的結構和功能得到更深地了解，進而對疾病問題得到解決。本課程將以深入簡出的方式讓同學認識病毒：從病毒的起源，病毒如何進入宿主細胞與複製，並在宿主群體間存活和傳播所必須具備的機制。通過一系列較具代表性的人類病毒為例子進行介紹病毒複製的基礎、人類與病毒的相互作用以及如何導致疾病。同時認識人體 4006 的疫系統如何對抗病毒。了解為什麼新興病毒的出現並造成疫情。人類應如何應對。最後介紹兩種不尋常的傳染因子 - 類病毒和狂牛病蛋白。它們與病毒似乎都是在生命起源中在化學演化時期殘留下來的分子。"><meta data-n-head="1" data-hid="og:url" name="og:url" property="og:url" content="https://ntut-course.gnehs.net/course/112/1/324722"><meta data-n-head="1" data-hid="og:image" name="og:image" property="og:image" content="https://ntut-course-og.gne
