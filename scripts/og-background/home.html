<!doctype html>
<!--
  Lays out the home page og image (static/og.jpg): the title on the left and a phone
  showing the site on the right, cropped by the bottom edge, over the pebbles
  render. It is set in the locally installed jf-jinxuan, so it is rendered
  here rather than by the worker.
  1. take a screenshot of the site on an iPhone and save it as out-site-phone.webp
  2. open http://127.0.0.1:8765/index.html?home&save to render out-home.png (see index.html)
  3. "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=2 --window-size=1200,600 --virtual-time-budget=3000 --screenshot=scripts/og-background/out-og.png "file://$PWD/scripts/og-background/home.html"
  4. sips -s format jpeg -s formatOptions 88 scripts/og-background/out-og.png --out static/og.jpg
-->
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<style>
	@font-face { font-family: 'Jinxuan'; font-weight: 500; src: url('file:///Users/gnehs/Library/Fonts/jf-jinxuan-4.0-medium.otf'); }
	@font-face { font-family: 'Jinxuan'; font-weight: 700; src: url('file:///Users/gnehs/Library/Fonts/jf-jinxuan-4.0-bold.otf'); }
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 600px; overflow: hidden; }
	body {
		position: relative;
		background: #e7efed url('out-home.png') 0 0 / 1200px 600px no-repeat;
		font-family: 'Jinxuan', sans-serif;
		font-feature-settings: 'palt';
		color: #123532;
	}

	/* a flat phone, 390×844 points drawn at 0.8 scale, rising from the bottom edge */
	.phone {
		position: absolute; left: 720px; top: 64px;
		width: 340px; height: 700px;
		padding: 11px;
		border-radius: 58px;
		background: #1b1d1f;
		box-shadow:
			inset 0 0 0 2px #6d7378, inset 0 0 0 4px #2a2d30,
			0 30px 60px rgba(18, 53, 50, 0.18), 0 6px 18px rgba(18, 53, 50, 0.12);
	}
	/* the action button and volume on the left, the side button on the right */
	.button { position: absolute; width: 3px; background: #4a4f53; }
	.button.left { left: -3px; border-radius: 2px 0 0 2px; }
	.button.right { right: -3px; border-radius: 0 2px 2px 0; }
	.screen {
		position: relative; width: 100%; height: 100%;
		border-radius: 47px; overflow: hidden;
		background: #fff;
	}
	.island {
		position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
		width: 98px; height: 28px; border-radius: 14px; background: #000;
	}
	.site { display: block; width: 100%; }

	.text {
		position: absolute; left: 76px; top: 0; bottom: 0; width: 580px;
		display: flex; flex-direction: column; justify-content: center;
	}
	.icon { width: 64px; height: 64px; margin-left: -6px; }
	h1 { margin-top: 18px; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: 1px; }
	.lede { margin-top: 14px; font-size: 26px; font-weight: 500; color: #4f716c; line-height: 1.5; }
</style>
</head>
<body>
	<div class="phone">
		<i class="button left" style="top: 118px; height: 26px"></i>
		<i class="button left" style="top: 166px; height: 50px"></i>
		<i class="button left" style="top: 228px; height: 50px"></i>
		<i class="button right" style="top: 190px; height: 80px"></i>
		<div class="screen">
			<div class="island"></div>
			<img class="site" src="out-site-phone.webp" alt="" />
		</div>
	</div>

	<div class="text">
		<img class="icon" src="../../static/icon.png" alt="" />
		<h1>北科課程好朋友</h1>
		<div class="lede">最新課程資訊與課綱，<br />衝堂偵測讓選課更輕鬆。</div>
	</div>
</body>
</html>
